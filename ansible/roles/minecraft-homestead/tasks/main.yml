---
# Serveur Minecraft "Homestead" (modpack CurseForge) via itzg/minecraft-server.
# Le conteneur est désormais créé par /usr/local/sbin/minecraft-ctl, qui lit
# le modpack dans /var/lib/minecraft-panel/config.json : le panneau de
# monitoring peut donc changer de modpack sans toucher à Ansible.
# Port 25565 exposé directement (TCP brut, pas de nginx).

- name: Installer les outils nécessaires au panneau (zip, unzip, jq)
  ansible.builtin.apt:
    name: [zip, unzip, jq]
    state: present

- name: Créer le dossier de données persistantes Minecraft
  ansible.builtin.file: { path: /var/minecraft-homestead-data, state: directory, mode: "0755" }

- name: Dossiers du panneau (config modifiable par l'appli, uploads)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: "0700"
  loop: [/var/lib/minecraft-panel, /var/minecraft-uploads]

- name: Dossier root pour la clé CurseForge
  ansible.builtin.file: { path: /etc/minecraft, state: directory, owner: root, group: root, mode: "0700" }

- name: Clé API CurseForge (lisible par root uniquement)
  ansible.builtin.copy:
    dest: /etc/minecraft/cf_api_key
    content: "{{ vault_curseforge_api_key }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Config modpack initiale (n'écrase jamais ce que le panneau a modifié)
  ansible.builtin.copy:
    dest: /var/lib/minecraft-panel/config.json
    content: "{{ {'slug': minecraft_cf_slug, 'fileId': (minecraft_cf_file_id | default('') | string)} | to_nice_json }}"
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: "0600"
    force: false

- name: Installer minecraft-ctl
  ansible.builtin.template:
    src: minecraft-ctl.j2
    dest: /usr/local/sbin/minecraft-ctl
    owner: root
    group: root
    mode: "0750"

- name: Droits sudo du panneau (sous-commandes exactes)
  ansible.builtin.template:
    src: minecraft-sudoers.j2
    dest: /etc/sudoers.d/minecraft-panel
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Créer le conteneur s'il n'existe pas encore
  ansible.builtin.command: /usr/local/sbin/minecraft-ctl create
  changed_when: false

- name: S'assurer que le conteneur démarre au boot
  ansible.builtin.command: docker update --restart unless-stopped homestead
  changed_when: false
