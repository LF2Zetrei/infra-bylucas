---
# Étape 4 de la liste : Firewall UFW
# Ordre critique : SSH doit être autorisé AVANT d'activer UFW, sinon on
# se coupe soi-même l'accès au serveur.

- name: Installer UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Politique par défaut - tout bloquer en entrée
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Politique par défaut - tout autoriser en sortie
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Autoriser SSH
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Autoriser HTTP (80)
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Autoriser HTTPS (443)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Autoriser Minecraft (25565) - exposé publiquement, pas de proxy nginx possible ici
  community.general.ufw:
    rule: allow
    port: "25565"
    proto: tcp

- name: Activer UFW
  community.general.ufw:
    state: enabled
