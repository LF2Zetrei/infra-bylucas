---
# Rôle partagé : Warp10 (base de données time-series), via Docker.
# RAM strictement plafonnée (important sur un VPS à 7.6 Go sans marge) et
# jamais exposé directement à internet - seul ton app Next.js (en local sur
# le VPS) y accède, via localhost:8080. Nginx ne fait JAMAIS proxy vers Warp10.

- name: Créer le dossier de données persistantes Warp10
  ansible.builtin.file:
    path: /var/warp10-data
    state: directory
    mode: "0755"

- name: Vérifier si le conteneur Warp10 existe déjà
  ansible.builtin.command: docker ps -a --filter "name=warp10" --format "{{ '{{.Names}}' }}"
  register: warp10_container_check
  changed_when: false

- name: Lancer le conteneur Warp10 (RAM plafonnée, localhost uniquement)
  ansible.builtin.command: >
    docker run -d
    --name warp10
    --restart unless-stopped
    -p 127.0.0.1:8080:8080
    -p 127.0.0.1:8081:8081
    -e WARP10_HEAP={{ warp10_heap }}
    -e WARP10_HEAP_MAX={{ warp10_heap }}
    -e NO_SENSISION=true
    -v /var/warp10-data:/data
    warp10io/warp10:{{ warp10_version }}
  when: "'warp10' not in warp10_container_check.stdout"

- name: S'assurer que Warp10 démarre au boot (via la politique de restart Docker)
  ansible.builtin.command: docker update --restart unless-stopped warp10
  changed_when: false